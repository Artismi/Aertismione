# Il sito su Netlify. Next.js lo riconosce da solo (con l'adattatore di Netlify per
# Next): pagine, immagini, le rewrite verso Porto Vecchio e le regole di sicurezza
# di next.config.mjs. Le variabili (NOTION_*, ed eventualmente
# NEXT_PUBLIC_PORTO_VECCHIO_URL) si mettono nel pannello di Netlify.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
